<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Spese fiscali italiane — RSF 2024</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_simple.min.css" rel="stylesheet">
<style>
  :root {
    --fg: #1a1a1a;
    --muted: #666;
    --border: #d8d8d8;
    --neg: #b03030;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    margin: 0;
    padding: 16px 20px 32px;
    max-width: 100%;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 12px; font-size: 13px; }
  .sub a { color: var(--muted); }
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .dash {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .panel {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    background: #fafafa;
    min-height: 180px;
  }
  .panel h3 {
    font-size: 12px; font-weight: 600; margin: 0 0 6px;
    color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
  }
  .bar-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
    gap: 8px;
    align-items: center;
    margin: 3px 0;
    font-size: 12px;
    line-height: 16px;
  }
  .bar-row .lbl {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
  }
  .bar-row .lbl:hover { color: #0a58ca; text-decoration: underline; }
  .bar-row .bar-cell {
    position: relative; height: 16px; background: #f0e6e6; border-radius: 2px;
    overflow: hidden;
  }
  .bar-row .bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--neg);
    opacity: .75;
  }
  .bar-row .val {
    position: absolute; right: 5px; top: 0; bottom: 0;
    display: flex; align-items: center;
    font-variant-numeric: tabular-nums;
    color: #1a1a1a; font-size: 11px;
    white-space: nowrap;
    pointer-events: none;
  }
  #search {
    flex: 1; min-width: 240px;
    padding: 8px 10px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 4px;
  }
  .stats { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .cols-btn {
    position: relative;
    padding: 7px 12px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 4px;
    background: #fff; cursor: pointer;
  }
  .cols-menu {
    display: none;
    position: absolute; top: 100%; right: 0;
    background: #fff; border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    padding: 6px 0;
    min-width: 200px;
    z-index: 10;
    margin-top: 4px;
  }
  .cols-menu.open { display: block; }
  .cols-menu label {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px;
    font-size: 13px; cursor: pointer;
  }
  .cols-menu label:hover { background: #f3f3f3; }
  .cols-menu input { margin: 0; }
  .neg { color: var(--neg); font-variant-numeric: tabular-nums; text-align: right; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .descr { white-space: normal; }
  #table { font-size: 13px; }
  .tabulator { border: 1px solid var(--border); }
  .tabulator .tabulator-header .tabulator-col {
    background: #f5f5f5;
  }
  a { color: #0a58ca; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>Spese fiscali italiane — Rapporto Annuale 2024</h1>
<div class="sub">
  Le 575 misure catalogate nella Tavola 1 del
  <a href="https://www.mef.gov.it/export/sites/MEF/documenti-pubblicazioni/rapporti-relazioni/documenti/RSF-2024.pdf" target="_blank">RSF 2024</a>.
  Cerca, filtra e ordina. Effetti finanziari in milioni di euro (negativo = minor gettito).
</div>

<div class="dash">
  <div class="panel" id="panel-missione"><h3>Per missione (top 8)</h3><div class="rows"></div></div>
  <div class="panel" id="panel-categoria"><h3>Per categoria fiscale</h3><div class="rows"></div></div>
  <div class="panel" id="panel-natura"><h3>Per natura (top 8)</h3><div class="rows"></div></div>
</div>

<div class="controls">
  <input id="search" type="search" placeholder="Cerca in descrizione, norma, beneficiari, missione…" autofocus>
  <span class="stats" id="stats"></span>
  <div style="position:relative">
    <button class="cols-btn" id="cols-btn">Colonne ▾</button>
    <div class="cols-menu" id="cols-menu"></div>
  </div>
</div>

<div id="table"></div>

<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script>
const fmtEUR = (cell) => {
  const v = cell.getValue();
  if (v === null || v === undefined || v === "") return "";
  const s = (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1));
  return Number(s).toLocaleString("it-IT");
};
const colorNeg = (cell) => {
  const v = cell.getValue();
  if (v !== null && v < 0) cell.getElement().classList.add("neg");
  else if (v !== null) cell.getElement().classList.add("num");
  return fmtEUR(cell);
};

// Normattiva linker: use pre-parsed norma_url if available, else fall back
// to a Google site-search of normattiva.it. About 99.7% of measures resolve.
const normaLink = (cell) => {
  const v = cell.getValue();
  if (!v) return "";
  const d = cell.getRow().getData();
  const url = d.norma_url
    || ("https://www.google.com/search?q=" + encodeURIComponent("site:normattiva.it " + v));
  const cls = d.norma_url ? "" : ' style="color:#888"';
  return `<a href="${url}" target="_blank"${cls}>${v}</a>`;
};

// Short labels for missioni whose official names are awkwardly long.
// Anything not in this map gets sentence-case (first letter upper, rest lower).
const MISSIONE_SHORT = {
  "AGRICOLTURA POLITICHE AGROALIMENTARI E PESCA": "Agricoltura e pesca",
  "COMPETITIVITA' E SVILUPPO DELLE IMPRESE": "Imprese",
  "COMPETITIVITA’ E SVILUPPO DELLE IMPRESE": "Imprese",
  "DIRITTO ALLA MOBILITA' E SVILUPPO DEI SISTEMI DI TRASPORTO": "Mobilità e trasporti",
  "DIRITTO ALLA MOBILITA’ E SVILUPPO DEI SISTEMI DI TRASPORTO": "Mobilità e trasporti",
  "INFRASTRUTTURE PUBBLICHE E LOGISTICA": "Infrastrutture",
  "COMMERCIO INTERNAZIONALE ED INTERNAZIONALIZZAZIONE DEL SISTEMA PRODUTTIVO": "Commercio estero",
  "RICERCA E INNOVAZIONE": "Ricerca",
  "SVILUPPO SOSTENIBILE E TUTELA DEL TERRITORIO E DELL'AMBIENTE": "Ambiente e territorio",
  "SVILUPPO SOSTENIBILE E TUTELA DEL TERRITORIO E DELL’AMBIENTE": "Ambiente e territorio",
  "CASA E ASSETTO URBANISTICO": "Casa",
  "TUTELA DELLA SALUTE": "Salute",
  "TUTELA E VALORIZZAZIONE DEI BENI E ATTIVITA' CULTURALI E PAESAGGISTICI": "Beni culturali",
  "TUTELA E VALORIZZAZIONE DEI BENI E ATTIVITA’ CULTURALI E PAESAGGISTICI": "Beni culturali",
  "ISTRUZIONE SCOLASTICA": "Scuola",
  "ISTRUZIONE UNIVERSITARIA E FORMAZIONE POST-UNIVERSITARIA": "Università",
  "DIRITTI SOCIALI, POLITICHE SOCIALI E FAMIGLIA": "Politiche sociali",
  "POLITICHE PREVIDENZIALI": "Previdenza",
  "POLITICHE PER IL LAVORO": "Lavoro",
  "IMMIGRAZIONE, ACCOGLIENZA E GARANZIA DEI DIRITTI": "Immigrazione",
  "SVILUPPO E RIEQUILIBRIO TERRITORIALE": "Coesione territoriale",
  "POLITICHE ECONOMICO-FINANZIARIE E DI BILANCIO E TUTELA DELLA FINANZA PUBBLICA": "Finanza pubblica",
  "POLITICHE ECONOMICO-FINANZIARIE E DI BILANCIO": "Finanza pubblica",
  "GIOVANI E SPORT": "Giovani e sport",
  "TURISMO": "Turismo",
  "COMUNICAZIONI": "Comunicazioni",
  "REGOLAZIONE DEI MERCATI": "Mercati",
  "SERVIZI GENERALI DELLE AMMINISTRAZIONI PUBBLICHE": "Servizi generali",
  "FONDI DA RIPARTIRE": "Fondi da ripartire",
};
const sentenceCase = (s) => s ? (s.charAt(0).toUpperCase() + s.slice(1).toLowerCase()) : s;
const shortMissione = (s) => {
  if (!s) return s;
  const stripped = s.replace(/^\d+:\s*/, "");
  return MISSIONE_SHORT[stripped] || sentenceCase(stripped);
};

fetch("measures.json").then(r => r.json()).then(data => {
  data.forEach(d => {
    if (d.missione) d.missione = shortMissione(d.missione);
  });
  const table = new Tabulator("#table", {
    data,
    layout: "fitDataStretch",
    height: "calc(100vh - 160px)",
    pagination: false,
    headerFilterLiveFilterDelay: 200,
    initialSort: [{column: "effetto_2025", dir: "asc"}],
    columns: [
      {title: "N.",          field: "n", width: 55, headerFilter: false, hozAlign: "right",
        headerTooltip: "Numero d'ordine nella Tavola 1 dell'RSF 2024"},
      {title: "Missione",    field: "missione", width: 180,
        headerFilter: "list",
        headerFilterParams: {valuesLookup: true, autocomplete: true, allowEmpty: true, clearable: true},
        headerTooltip: "Missione di spesa cui la misura è associata nel bilancio dello Stato (etichetta abbreviata; il dato grezzo è la denominazione ufficiale RSF)"},
      {title: "Norma",       field: "norma", width: 230, headerFilter: "input",
        formatter: normaLink,
        headerTooltip: "Norma di riferimento (atto istitutivo della spesa fiscale). Il link rimanda al testo consolidato su Normattiva quando risolvibile"},
      {title: "Descrizione", field: "descrizione", widthGrow: 2, minWidth: 220,
        headerFilter: "input",
        formatter: "textarea",
        cssClass: "descr",
        headerTooltip: "Descrizione sintetica della misura come riportata in RSF 2024"},
      {title: "Tributo",     field: "tributo_norm", width: 110,
        headerFilter: "list",
        headerFilterParams: {valuesLookup: true, autocomplete: true, allowEmpty: true, clearable: true},
        headerTooltip: "Tributo normalizzato. Combo come IRPEF+IRES indicano misure che operano su più tributi. CREDITO è una forma di erogazione (credito d'imposta)"},
      {title: "Categoria",   field: "categoria", width: 130,
        headerFilter: "list",
        headerFilterParams: {valuesLookup: true, autocomplete: true, allowEmpty: true, clearable: true},
        headerTooltip: "Categoria fiscale: DIRETTA (IRPEF, IRES, IRAP), INDIRETTA (IVA, accisa, registro/bollo, successioni), SOSTITUTIVA, CREDITO_IMPOSTA, MISTA, ALTRO"},
      {title: "Tributo (raw)", field: "tributo", width: 180, headerFilter: "input", visible: false,
        headerTooltip: "Etichetta originale del tributo come riportata in RSF 2024 (prima della normalizzazione)"},
      {title: "Vigenza",     field: "termine_vigenza", width: 80, headerFilter: "input",
        headerTooltip: "Termine di vigenza della misura: ultimo anno d'imposta in cui si applica, oppure 'A REGIME' se permanente"},
      {title: "Natura",      field: "natura", width: 150,
        headerFilter: "list",
        headerFilterParams: {valuesLookup: true, autocomplete: true, allowEmpty: true, clearable: true},
        headerTooltip: "Tipologia tecnica della misura: esenzione, deduzione, detrazione, credito d'imposta, riduzione d'aliquota, regime speciale, ..."},
      {title: "2025",        field: "effetto_2025", width: 70, hozAlign: "right",
        formatter: colorNeg, sorter: "number",
        headerTooltip: "Effetto finanziario stimato per il 2025 in milioni di euro (negativo = minor gettito per l'erario)"},
      {title: "2026",        field: "effetto_2026", width: 70, hozAlign: "right",
        formatter: colorNeg, sorter: "number",
        headerTooltip: "Effetto finanziario stimato per il 2026 in milioni di euro"},
      {title: "2027",        field: "effetto_2027", width: 70, hozAlign: "right",
        formatter: colorNeg, sorter: "number",
        headerTooltip: "Effetto finanziario stimato per il 2027 in milioni di euro"},
      {title: "Beneficiari", field: "beneficiari", width: 200, headerFilter: "input",
        headerTooltip: "Soggetti e categorie dei beneficiari (persone fisiche, imprese, particolari categorie, ...)"},
      {title: "Frequenze",   field: "numero_frequenze", width: 100, headerFilter: "input", visible: false,
        headerTooltip: "Numero di beneficiari osservato (frequenza), quando disponibile"},
      {title: "Pro capite",  field: "effetto_procapite", width: 110, headerFilter: "input", visible: false,
        headerTooltip: "Effetto finanziario medio pro capite in euro, quando disponibile"},
      {title: ">5 anni",     field: "vigore_5plus", width: 80, headerFilter: "input", visible: false,
        headerTooltip: "Indica se la misura è in vigore da più di cinque anni (proxy di stratificazione storica)"},
      {title: "p.",          field: "page", width: 50, hozAlign: "right",
        headerTooltip: "Pagina del PDF RSF 2024 in cui la misura compare (link diretto)",
        formatter: (cell) => {
          const v = cell.getValue();
          if (!v) return "";
          return `<a href="https://www.mef.gov.it/export/sites/MEF/documenti-pubblicazioni/rapporti-relazioni/documenti/RSF-2024.pdf#page=${v}" target="_blank">${v}</a>`;
        }},
    ],
  });

  const stats = document.getElementById("stats");

  const aggregate = (rows, field, topN=8) => {
    const agg = new Map();
    rows.forEach(d => {
      const key = d[field] || "(n/d)";
      const v = d.effetto_2025;
      if (typeof v !== "number") return;
      const prev = agg.get(key) || {sum: 0, n: 0};
      prev.sum += v; prev.n += 1;
      agg.set(key, prev);
    });
    return [...agg.entries()]
      .map(([k, v]) => ({key: k, sum: v.sum, n: v.n, abs: Math.abs(v.sum)}))
      .sort((a, b) => b.abs - a.abs)
      .slice(0, topN);
  };

  const renderPanel = (panelId, field, items) => {
    const root = document.querySelector(`#${panelId} .rows`);
    const max = items.length ? items[0].abs : 1;
    root.innerHTML = items.map(it => {
      const pct = (it.abs / max * 100).toFixed(1);
      const lbl = (it.key.length > 38 ? it.key.slice(0, 36) + "…" : it.key);
      const val = (it.sum).toLocaleString("it-IT", {maximumFractionDigits: 0});
      return `<div class="bar-row" data-field="${field}" data-key="${it.key.replace(/"/g, "&quot;")}">
        <span class="lbl" title="${it.key} — ${it.n} misure">${lbl}</span>
        <div class="bar-cell">
          <div class="bar-fill" style="width:${pct}%"></div>
          <span class="val">${val}</span>
        </div>
      </div>`;
    }).join("");
  };

  const refreshDashboard = () => {
    const data = table.getRows("active").map(r => r.getData());
    renderPanel("panel-missione",  "missione",  aggregate(data, "missione"));
    renderPanel("panel-categoria", "categoria", aggregate(data, "categoria", 10));
    renderPanel("panel-natura",    "natura",    aggregate(data, "natura"));
  };

  // Click a dashboard label -> set the corresponding header filter
  document.addEventListener("click", (e) => {
    const row = e.target.closest(".bar-row");
    if (!row) return;
    const field = row.dataset.field, key = row.dataset.key;
    // toggle: if already filtered to this value, clear
    const cur = table.getHeaderFilterValue(field);
    table.setHeaderFilterValue(field, cur === key ? "" : key);
  });

  const updateStats = () => {
    const rows = table.getRows("active");
    let sum = 0, n = 0;
    rows.forEach(r => {
      const v = r.getData().effetto_2025;
      if (typeof v === "number") { sum += v; n++; }
    });
    stats.textContent = `${rows.length} misure visibili · Σ effetto 2025 (quantificate, ${n}): ${sum.toLocaleString("it-IT", {maximumFractionDigits: 0})} mln €`;
    refreshDashboard();
  };
  table.on("dataFiltered", updateStats);
  table.on("tableBuilt", updateStats);

  // Column show/hide menu — populated once Tabulator has built the columns.
  const colsMenu = document.getElementById("cols-menu");
  const colsBtn = document.getElementById("cols-btn");
  const buildColsMenu = () => {
    const items = table.getColumns().map(col => {
      const f = col.getField();
      if (!f || f === "n") return "";
      const title = col.getDefinition().title;
      const checked = col.isVisible() ? "checked" : "";
      return `<label><input type="checkbox" data-field="${f}" ${checked}>${title}</label>`;
    }).join("");
    colsMenu.innerHTML = items;
  };
  table.on("tableBuilt", buildColsMenu);

  colsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!colsMenu.innerHTML.trim()) buildColsMenu();
    colsMenu.classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (e.target === colsBtn || colsMenu.contains(e.target)) return;
    colsMenu.classList.remove("open");
  });
  colsMenu.addEventListener("change", (e) => {
    const f = e.target.dataset.field;
    if (!f) return;
    if (e.target.checked) table.showColumn(f);
    else table.hideColumn(f);
  });

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { table.clearFilter(true); return; }
    table.setFilter((d) => {
      return (
        (d.descrizione && d.descrizione.toLowerCase().includes(q)) ||
        (d.norma && d.norma.toLowerCase().includes(q)) ||
        (d.beneficiari && d.beneficiari.toLowerCase().includes(q)) ||
        (d.missione && d.missione.toLowerCase().includes(q)) ||
        (d.natura && d.natura.toLowerCase().includes(q)) ||
        (d.tributo && d.tributo.toLowerCase().includes(q))
      );
    });
  });
});
</script>
</body>
</html>
